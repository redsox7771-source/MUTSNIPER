[project]
name = "mutsniper"
version = "0.1.0"
description = "Continuous snipe scanner for the Madden Ultimate Team auction house"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "playwright>=1.45",
    "python-dotenv>=1.0",
]

[project.scripts]
mutsniper = "mutsniper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
